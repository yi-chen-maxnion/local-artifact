<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Workflow settings</title>
<style>
 *,*::before,*::after{box-sizing:border-box}
 body{font:14px/1.6 ui-sans-serif,system-ui,sans-serif;margin:0;background:#f6f7f9;color:#18181b}
 header{background:#fff;border-bottom:1px solid #e4e4e7;padding:14px 28px;display:flex;align-items:center;gap:12px}
 h1{font-size:16px;margin:0;flex:1}
 main{max-width:720px;margin:32px auto;padding:0 24px}
 .card{background:#fff;border:1px solid #e4e4e7;border-radius:10px;padding:22px;margin-bottom:18px}
 label{display:block;font-weight:600;font-size:12px;margin:14px 0 5px;color:#52525b}
 input,select{width:100%;padding:8px 10px;border:1px solid #d4d4d8;border-radius:6px;font:inherit}
 .toolbar{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
 .btn{padding:8px 16px;border-radius:6px;border:1px solid transparent;font-weight:600;cursor:pointer}
 .btn-primary{background:#2563eb;color:#fff}
 .btn-ghost{background:#fff;border-color:#d4d4d8;color:#3f3f46}
 .muted{color:#71717a;font-size:12px}
</style></head><body>
<header><h1>Workflow settings</h1><span class="muted">draft</span></header>
<main>
  <div class="card">
    <h2 style="margin:0;font-size:15px">General</h2>
    <label for="n">Workflow name</label>
    <input id="n" value="Invoice extraction">
    <label for="c">Concurrency</label>
    <select id="c"><option>1</option><option selected>4</option><option>8</option></select>
    <p class="muted">Higher concurrency uses more worker memory.</p>
    <p class="muted" lang="zh-Hant">提高平行度會使用更多記憶體。</p>
    <div class="toolbar">
      <button class="btn btn-ghost" data-testid="cancel">Cancel</button>
      <button class="btn btn-primary" data-testid="save-workflow">Save</button>
    </div>
  </div>
</main></body></html>
